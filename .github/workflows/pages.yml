name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject LFS pointers and oversized videos
        run: |
          python3 - << 'PY'
          import pathlib
          files = sorted(pathlib.Path("media").glob("*.mp4"))
          expected = 44
          if len(files) != expected:
              raise SystemExit(f"expected {expected} mp4 files, found {len(files)}")
          limit = 15_000_000
          for path in files:
              data = path.read_bytes()
              if b"git-lfs.github.com" in data[:180]:
                  raise SystemExit(f"Git LFS pointer is not allowed: {path}")
              if len(data) >= limit:
                  raise SystemExit(f"video must be under 15MB: {path}")
          PY

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -a index.html credits.html css js catalog.json media licenses history .nojekyll _site/
          cp README.txt _site/README.txt

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
